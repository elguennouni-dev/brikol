# Generates Sanai3i.xcodeproj with XcodeGen (https://github.com/yonaskolb/XcodeGen)
#   brew install xcodegen && xcodegen generate && open Sanai3i.xcodeproj
name: Sanai3i
options:
  bundleIdPrefix: ma.sanai3i
  deploymentTarget:
    iOS: "15.0"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Sanai3i:
    type: application
    platform: iOS
    sources:
      - Sanai3i
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ma.sanai3i.app
        INFOPLIST_FILE: Sanai3i/Info.plist
        GENERATE_INFOPLIST_FILE: NO
