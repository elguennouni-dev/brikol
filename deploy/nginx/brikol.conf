# Nginx for snai3i.elguennouni.site (aaPanel: Website > the site > Config, replace the whole file with this,
# keep your certificate paths). Fixes from the penetration test: HTTPS only + HSTS, TLS 1.2/1.3 with modern
# ciphers, proxy headers set by Nginx (never by the client), uploads up to 100 MB.

# --- port 80: everything goes to HTTPS (Let's Encrypt renewals still work) ---------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name snai3i.elguennouni.site;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/snai3i.elguennouni.site;
        allow all;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS --------------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name snai3i.elguennouni.site;

    # aaPanel's certificate paths (Website > SSL keeps them up to date)
    ssl_certificate     /www/server/panel/vhost/cert/snai3i.elguennouni.site/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/snai3i.elguennouni.site/privkey.pem;

    # Mozilla "intermediate": no TLS 1.0/1.1, forward secrecy only, no CBC / CCM8 suites
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:BrikolSSL:10m;
    ssl_session_tickets off;

    # the app also sends it; here it covers Nginx's own error pages too
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 100m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # set by Nginx, never passed through from the client: real client address, scheme, host
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-Prefix "";

        # live notifications (Server-Sent Events): no buffering, long reads
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
    }

    access_log /www/wwwlogs/snai3i.elguennouni.site.log;
    error_log  /www/wwwlogs/snai3i.elguennouni.site.error.log;
}
