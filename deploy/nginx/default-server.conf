# Requests by bare IP or unknown host names get nothing (no hosting-panel default pages).
# aaPanel: put this file in /www/server/panel/vhost/nginx/0.default.conf (replace the existing one), then reload.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;      # nginx >= 1.19.4: no certificate shown to unknown names
}
