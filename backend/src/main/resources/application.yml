server:
  port: ${PORT:8080}
  # Tomcat's RemoteIpValve: X-Forwarded-For / -Proto are only trusted from internal proxies (Nginx on the host,
  # Docker network), and the client address is read from the right, so a client cannot fake its IP.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: sanai3i
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sanai3i?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:sanai3i}
    password: ${DB_PASSWORD:sanai3i}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # the schema is owned by Flyway (db/migration)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 65MB
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Override with a long random value in production (JWT_SECRET env var, 32+ chars)
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl-days: 30
  # Creates demo artisans, clients and requests when the database is empty
  seed: ${APP_SEED:false}
  # password of the demo accounts; empty = random (nobody can sign in as a demo user)
  seed-password: ${APP_SEED_PASSWORD:}
  # Only needed when the web app is served from another origin (not for the WebView apps)
  cors-origins: ${CORS_ORIGINS:}
  # public address of the site (links in push notifications, SEO pages)
  public-url: ${PUBLIC_URL:https://snai3i.elguennouni.site}
  downloads-dir: ${DOWNLOADS_DIR:./downloads}
  # photos, videos, voice notes, artisan documents
  uploads-dir: ${UPLOADS_DIR:./uploads}
  # "Sign in with Google": OAuth client ID of type "Web application" (public value, not a secret)
  google:
    client-id: ${GOOGLE_CLIENT_ID:817026513536-gunfjnt174iopu5fh51drsbf1m11g9bt.apps.googleusercontent.com}
  # SMS codes (sign-up check, forgotten password). provider: none (feature off), twilio, or log (codes in the logs, tests only)
  sms:
    provider: ${SMS_PROVIDER:none}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      # a Twilio phone number (+1...) or a Messaging Service SID (MG...)
      from: ${TWILIO_FROM:}
  # Important job events by WhatsApp or SMS (Twilio account above). channel: none, whatsapp, sms, log
  alerts:
    channel: ${ALERTS_CHANNEL:none}
    # the Twilio WhatsApp sender, e.g. +14155238886 (sandbox) or your approved business number
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
    # Content SID (HX...) of an approved template with one variable, e.g. "Brikol: {{1}}"
    whatsapp-template: ${TWILIO_WHATSAPP_TEMPLATE:}
  # Push notifications (Firebase Cloud Messaging). Empty = off.
  push:
    credentials-file: ${FCM_CREDENTIALS:}
    # web app config (Firebase console > Project settings > Your apps > Web app), public values
    web-api-key: ${FIREBASE_API_KEY:}
    web-app-id: ${FIREBASE_APP_ID:}
    project-id: ${FIREBASE_PROJECT_ID:}
    sender-id: ${FIREBASE_SENDER_ID:}
    vapid-key: ${FIREBASE_VAPID_KEY:}
  rate-limit:
    enabled: ${RATE_LIMIT:true}
  # The first administrator is created at start-up when both are set (see AdminBootstrap)
  admin:
    phone: ${ADMIN_PHONE:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Administrateur}
