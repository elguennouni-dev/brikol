# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# In-memory H2 database in MySQL mode: no MySQL installation needed. Data is lost on restart.
spring:
  datasource:
    url: jdbc:h2:mem:sanai3i;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:

app:
  seed: true
  # demo accounts (dev only): every seeded client / artisan uses this password
  seed-password: demo1234
  # tests and demos create many requests / files with the same accounts
  limits:
    max-open-requests: 500
    requests-per-day: 1000
    uploads-per-day: 1000
    uploads-per-hour: 1000
  admin:
    phone: "0699000000"
    password: admin12345
    name: Admin Demo
  rate-limit:
    enabled: false
