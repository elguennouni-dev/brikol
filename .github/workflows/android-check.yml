# Compiles the Android app (debug) when it changes, so Kotlin errors show up on every push.
name: Android build check
on:
  push:
    paths: ["mobile/android/**", ".github/workflows/android-check.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: assembleDebug
        working-directory: mobile/android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: brikol-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
